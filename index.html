<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel = "stylesheet" href = "style.css">
    <title>PLINKO</title>
  </head>
  <body>
    <canvas class = "background" id = "backgroundCanvas"></canvas>
    <img class = "shop-arrow" src="graphics/arrow-right.png" alt="shop to the right" style = "position: absolute; top: 50%; right: 0; transform: translate(0, -50%);">
    <div class = "shop-container"></div>
    <img src="graphics/redchip.png" alt="chips" class = "wallet-chip-image">
    <div class = "wallet-display">
      <p id = "wallet-amount"></p>
    </div>
    <img src="graphics/ticket.png" alt="tickets" class = "ticket-wallet-image">
    <div class = "ticket-wallet-display">
      <p id = "ticket-wallet-amount"></p>
    </div>
    <div class = "display-round-stats">Rounds left: 3 <br> Lives left: 10</div>
    <button class = "start-round-button">Start Round</button>
    <button class = "pay-off-debt">Pay off debt (15)<img src="graphics/redchip.png" alt="chip(s)"></button>
    <canvas id = "menu-canvas"></canvas>
    <div class = "menu-screen">
      <h1>PLINKO</h1>
      <button class = "start-button">Commit your soul</button>
    </div>
    <script src = "script.js"></script>
  </body>
</html>
